<svg width="850" height="150" viewBox="0 0 850 150" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&amp;display=swap');
    
    .text-base {
      font-family: 'Fira Code', monospace;
      fill: #74D24F;
      font-size: 18px;
      dominant-baseline: middle;
      text-anchor: middle;
      opacity: 0;
    }

    .typing {
      animation: fadeIn 0.1s forwards, typing 1.5s steps(30, end) forwards;
    }

    .line-1 { animation-delay: 0s; }
    .line-2 { animation-delay: 1.6s; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes typing {
      from { clip-path: inset(0 100% 0 0); }
      to { clip-path: inset(0 0 0 0); }
    }
  </style>

  <g transform="translate(200, 75)">
    <text x="0" y="-15" class="text-base line-1 typing">Master in</text>
    <text x="0" y="15" class="text-base line-2 typing">Sustainable Development</text>
  </g>

  <image x="385" y="35" width="80" height="80" xlink:href="https://raw.githubusercontent.com/Luveira/Luveira/main/Images/Tree_NBG.png" />

  <g transform="translate(650, 75)">
    <text x="0" y="-15" class="text-base line-1 typing">Concentration Area</text>
    <text x="0" y="15" class="text-base line-2 typing">Technology and Modeling</text>
  </g>
</svg>
